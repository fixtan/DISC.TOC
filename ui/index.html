<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>DISC.TOC</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="skins/aqua.css">
</head><body>
<div id="app">

  <!-- MAIN -->
  <section class="dt-panel" id="dt-main">
    <div class="dt-title-bar"><span>DISC.TOC</span><button class="dt-close-btn" id="dt-skin" title="スキン">◐</button></div>
    <div class="dt-display">
      <div class="dt-time-col">
        <div class="dt-time" id="dt-time">00:00</div>
        <canvas class="dt-spectrum" id="dt-spectrum" width="76" height="14"></canvas>
      </div>
      <div class="dt-track-info">
        <div class="dt-marquee-wrap"><div class="dt-marquee" id="dt-title">CDを入れてください</div></div>
        <div class="dt-specs" id="dt-specs">1411 KBPS  44 KHZ  STEREO</div>
      </div>
    </div>
    <input type="range" class="dt-slider" id="dt-seek" value="0" min="0" max="0" step="1">
    <div class="dt-controls">
      <button class="dt-btn" id="dt-prev" title="前へ">⏮</button>
      <button class="dt-btn" id="dt-play" title="再生">▶</button>
      <button class="dt-btn" id="dt-pause" title="一時停止">⏸</button>
      <button class="dt-btn" id="dt-stop" title="停止">⏹</button>
      <button class="dt-btn" id="dt-next" title="次へ">⏭</button>
      <input type="range" class="dt-slider dt-vol" id="dt-vol" min="0" max="1" step="0.05" value="1">
    </div>
    <div class="dt-toggles">
      <button class="dt-btn" id="dt-eq-toggle">EQ</button>
      <button class="dt-btn" id="dt-repeat">REP</button>
      <button class="dt-btn" id="dt-shuffle">SHUF</button>
    </div>
  </section>

  <!-- EQUALIZER -->
  <section class="dt-panel" id="dt-eq" hidden>
    <div class="dt-title-bar"><span>EQUALIZER</span><button class="dt-close-btn" id="dt-eq-close">✕</button></div>
    <canvas class="dt-eq-canvas" id="dt-eq-canvas" width="420" height="30"></canvas>
    <div class="dt-eq-sliders" id="dt-eq-sliders"></div>
    <div class="dt-eq-presets"><select id="dt-eq-preset" class="dt-select"></select></div>
  </section>

  <!-- PLAYLIST -->
  <section class="dt-panel" id="dt-pl">
    <div class="dt-title-bar"><span>PLAYLIST</span><span id="dt-count"></span></div>
    <div class="dt-toolbar">
      <select id="dt-drive" class="dt-select dt-drive"></select>
      <button class="dt-btn" id="dt-reload">読込</button>
      <select id="dt-cand" class="dt-select dt-cand" hidden></select>
    </div>
    <div class="dt-toolbar">
      <button class="dt-btn" id="dt-edit">編集</button>
      <button class="dt-btn" id="dt-save" hidden>保存</button>
      <span class="dt-sp"></span>
      <select id="dt-fmt" class="dt-select"><option value="txt">TXT</option><option value="csv">CSV</option><option value="cue">CUE</option><option value="json">JSON</option></select>
      <button class="dt-btn" id="dt-export">書き出し</button>
      <button class="dt-btn" id="dt-import">JSON読込</button>
      <button class="dt-btn" id="dt-mbreg" title="MusicBrainzにこのCDを登録するページを開く">MB登録</button>
      <input type="file" id="dt-file" accept=".json,application/json" hidden>
    </div>
    <div class="dt-toolbar">
      <span class="dt-lbl">WAV</span>
      <button class="dt-btn" id="dt-rip-one" title="選択中の曲をWAVで保存">選択曲</button>
      <button class="dt-btn" id="dt-rip-all" title="全曲をフォルダにWAVで保存">全曲</button>
      <button class="dt-btn" id="dt-rip-stop" hidden>中止</button>
    </div>
    <div class="dt-meta" id="dt-meta"></div>
    <ul class="dt-playlist-box" id="dt-list"></ul>
    <div class="dt-status" id="dt-status"></div>
  </section>

</div>
<script type="module" src="app.js"></script>
</body></html>
