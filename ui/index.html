<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>DISC.TOC</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="skins/aqua.css">
</head><body>
<div id="app">
  <!-- MAIN -->
  <section class="dt-panel" id="dt-main">
    <div class="dt-title-bar" id="dt-drag"><span>DISC.TOC</span>
      <span class="dt-tb-btns">
        <button class="dt-close-btn" id="dt-skin" title="スキン">◐</button>
        <button class="dt-close-btn" id="dt-min" title="最小化">–</button>
        <button class="dt-close-btn" id="dt-quit" title="終了">✕</button>
      </span>
    </div>
    <div class="dt-display">
      <div class="dt-time-col">
        <div class="dt-time" id="dt-time">00:00</div>
        <canvas class="dt-spectrum" id="dt-spectrum" width="76" height="14"></canvas>
      </div>
      <div class="dt-track-info">
        <div class="dt-marquee-wrap"><div class="dt-marquee" id="dt-title">CDを入れてください</div></div>
        <div class="dt-specs" id="dt-specs">1411 KBPS  44 KHZ  STEREO</div>
      </div>
    </div>
    <input type="range" class="dt-slider" id="dt-seek" value="0" min="0" max="0" step="1">
    <div class="dt-controls">
      <button class="dt-btn" id="dt-prev" title="前へ">⏮</button>
      <button class="dt-btn" id="dt-play" title="再生">▶</button>
      <button class="dt-btn" id="dt-pause" title="一時停止">⏸</button>
      <button class="dt-btn" id="dt-stop" title="停止">⏹</button>
      <button class="dt-btn" id="dt-next" title="次へ">⏭</button>
      <input type="range" class="dt-slider dt-vol" id="dt-vol" min="0" max="1" step="0.05" value="1">
    </div>
    <div class="dt-toggles">
      <button class="dt-btn" id="dt-eq-toggle" title="イコライザーの窓を出す・しまう">EQ</button>
      <button class="dt-btn" id="dt-pl-toggle" title="プレイリストの窓を出す・しまう">PL</button>
      <button class="dt-btn" id="dt-repeat">REP</button>
      <button class="dt-btn" id="dt-shuffle">SHUF</button>
    </div>
  </section>
</div>
<script type="module" src="app.js"></script>
</body></html>
